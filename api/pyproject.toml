[project]
name = "newtonite-ops-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Exact versions, and every indirect one in uv.lock: a fresh build installs what was tested.
dependencies = [
  "fastapi==0.143.5",
  "uvicorn[standard]==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "psycopg-pool==3.3.3",  # ConnectionPool.check_connection, used by db.LivePool
  "itsdangerous==2.2.0",
  "pyjwt[crypto]==2.15.1",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: Depends() in a default is FastAPI's documented idiom.
# EXE002: the Windows build context gives every file an executable bit; there is no shebang to add.
ignore = ["B008", "EXE002"]
