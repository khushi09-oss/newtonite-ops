[project]
name = "newtonite-ops-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "itsdangerous>=2.2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: Depends() in a default is FastAPI's documented idiom.
# EXE002: the Windows build context gives every file an executable bit; there is no shebang to add.
ignore = ["B008", "EXE002"]
