services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops}"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@postgres:5432/${POSTGRES_DB:-ops}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@postgres:5432/${POSTGRES_DB:-ops}
    depends_on:
      api: { condition: service_healthy }
    command: python worker.py

  web:
    image: node:20-alpine
    working_dir: /app
    environment:
      API_URL: http://api:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

volumes:
  pgdata:
  web_node_modules:
