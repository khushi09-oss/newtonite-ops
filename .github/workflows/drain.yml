name: Drain the outbox

# Vercel's free plan runs a scheduled job at most once a day. This asks the live API to sweep the
# outbox every hour, so a job left waiting while nobody uses the app waits an hour at most (D-40).
# The secret is the same CRON_SECRET the API checks; without it the endpoint answers 404.
on:
  schedule:
    - cron: "17 * * * *" # off the hour, when GitHub's scheduler is least busy
  workflow_dispatch:

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sweep the outbox
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # Retries cover a database still waking up (a 503 within ten seconds, D-35).
        run: >
          curl -fsS --retry 3 --retry-all-errors --retry-delay 10 --max-time 60
          -H "Authorization: Bearer $CRON_SECRET"
          https://newtonite-ops-vert.vercel.app/api/internal/drain
